<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Logo UPDS">
  <!-- Fila humana estilizada con círculos de conocimiento -->
  <g fill="none" stroke="#002b49" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Cabeza -->
    <circle cx="50" cy="28" r="10" fill="#002b49" stroke="none"/>
    <!-- Cuerpo -->
    <path d="M50 38 L50 65" />
    <!-- Brazos arriba -->
    <path d="M50 45 L35 35" />
    <path d="M50 45 L65 35" />
    <!-- Piernas -->
    <path d="M50 65 L40 80" />
    <path d="M50 65 L60 80" />
  </g>
  <!-- Círculos de conocimiento alrededor -->
  <g fill="#002b49">
    <circle cx="30" cy="30" r="3"/>
    <circle cx="70" cy="30" r="3"/>
    <circle cx="25" cy="50" r="3"/>
    <circle cx="75" cy="50" r="3"/>
    <circle cx="35" cy="65" r="3"/>
    <circle cx="65" cy="65" r="3"/>
  </g>
</svg>