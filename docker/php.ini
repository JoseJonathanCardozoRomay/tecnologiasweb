; Configuración PHP de la aplicación (montada en /usr/local/etc/php/conf.d/zz-app.ini)
; Debe coincidir con los límites validados en los controladores de carga de archivos.

; Límite de subida: el modelo DocumentoExpedienteModel acepta hasta 5 MB,
; por lo que PHP debe permitir al menos ese tamaño (antes era 2M y rechazaba
; archivos legítimos con UPLOAD_ERR_INI_SIZE).
upload_max_filesize = 6M
post_max_size = 8M
max_file_uploads = 20

; Errores de subida legibles en lugar de notices silenciosos.
display_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED

; Exposición de archivos subidos: nunca se interpretan como PHP.
expose_php = Off

; Sesiones
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1

; Zona horaria por defecto (la aplicación la fija con date_default_timezone_set).
date.timezone = America/Asuncion
